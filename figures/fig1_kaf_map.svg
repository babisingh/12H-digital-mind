<text x="24" y="694" font-size="13" fill="#444444">Twelve houses jointly cover a situated existence. Each sector shows the house's traditional domain (grey)</text>
<text x="24" y="714" font-size="13" fill="#444444">and its reading for an AI model's situation (coral). North Indian convention: the first house at the top,</text>
<text x="24" y="734" font-size="13" fill="#444444">houses advancing anti-clockwise. The frozen battery asks five questions per house, sixty in all.</text>
